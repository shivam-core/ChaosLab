services:
  - type: web
    name: chaoslab-web
    env: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: "alembic upgrade head"
    dockerCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaoslab-db
          property: connectionString

  - type: worker
    name: chaoslab-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "python -m app.jobs.worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaoslab-db
          property: connectionString

databases:
  - name: chaoslab-db
    plan: free
    postgresMajorVersion: 16
