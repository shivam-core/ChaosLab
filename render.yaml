services:
  - type: web
    name: chaoslab-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    preDeployCommand: "alembic upgrade head"
    dockerCommand: "bash -c 'python -m app.jobs.worker & python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaoslab-db
          property: connectionString

databases:
  - name: chaoslab-db
    plan: free
    postgresMajorVersion: 16
