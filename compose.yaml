services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: chaos
      POSTGRES_PASSWORD: chaos
      POSTGRES_DB: chaoslab
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaos -d chaoslab"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://chaos:chaos@db:5432/chaoslab
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://chaos:chaos@db:5432/chaoslab
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
